<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SyncBeat — Mobile</title>
  <meta name="description" content="Player de YouTube sincronizado em tempo real para salas compartilhadas." />
  <meta name="theme-color" content="#090a0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SyncBeat" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="/icons/icon-192.png" />
  <script>
    (function() {
      const theme = localStorage.getItem('syncbeat_theme') || 'dark';
      if (theme === 'light') {
        document.documentElement.classList.add('light-theme');
      }
    })();
  </script>
  <script src="/js/device-router.js"></script>
</head>
<body class="mobile-home-page">
  <main class="mobile-home-shell">
    <header class="mobile-home-topbar">
      <div class="mobile-brand">
        <span class="syncbeat-mobile-mark" aria-hidden="true">
          <span></span>
        </span>
        <div>
          <strong>SyncBeat</strong>
          <span>Ouça junto</span>
        </div>
      </div>
      <button id="theme-toggle" class="btn-theme-toggle" aria-label="Alterar Tema">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="theme-icon-sun" style="display:none;"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="theme-icon-moon"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      </button>
    </header>

    <section class="mobile-home-hero">
      <div class="mobile-logo-orbit syncbeat-mobile-mark large" aria-hidden="true">
        <span></span>
      </div>
      <h1>Sync<span>Beat</span></h1>
      <p>YouTube em sala, controle do host e reprodução sincronizada.</p>
      <div class="mobile-feature-row">
        <span>YouTube</span>
        <span>Tempo real</span>
        <span>PWA</span>
      </div>
    </section>

    <section id="landing-section" class="mobile-auth-panel">
      <button class="btn mobile-google-btn" id="login-google-btn">
        <svg width="20" height="20" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Continuar com Google
      </button>
    </section>

    <section id="room-section" class="mobile-room-entry" style="display:none;">
      <div class="mobile-user-strip">
        <div id="user-avatar" class="mobile-user-avatar"></div>
        <div class="mobile-user-copy">
          <span>Logado como</span>
          <strong id="user-display-name"></strong>
        </div>
        <button id="logout-btn" class="btn btn-ghost btn-sm">Sair</button>
      </div>

      <div class="mobile-action-stack">
        <article class="glass mobile-action-card index-card">
          <div class="mobile-action-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
          </div>
          <div>
            <h2>Criar sala</h2>
            <p>Você controla a fila e o playback.</p>
          </div>
          <button class="btn btn-primary" id="create-btn">Criar sala</button>
        </article>

        <article class="glass mobile-action-card index-card">
          <div class="mobile-action-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3z"/><path d="M3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>
          </div>
          <div class="input-group">
            <label for="join-code">Código da sala</label>
            <input type="text" id="join-code" placeholder="ABC123" maxlength="6" autocomplete="off" />
          </div>
          <button class="btn btn-secondary" id="join-btn">Entrar</button>
        </article>
      </div>

      <section id="my-rooms-container" class="mobile-saved-rooms" style="display:none;">
        <div class="mobile-section-title">Minhas salas</div>
        <div id="my-rooms-list"></div>
      </section>
    </section>
  </main>

  <div id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
